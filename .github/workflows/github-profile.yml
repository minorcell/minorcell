name: Generate Contribution Snake and GitHub Profile
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-output
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate GitHub profile JSON
        env:
          GH_TOKEN: ${{ secrets.SNAKE_GITHUB_TOKEN }}
        run: node scripts/sync-github-profile.ts --output dist/github.json
      - name: Generate snake SVGs
        env:
          # Repository secret: a PAT owned by github.repository_owner with read:user.
          GH_TOKEN: ${{ secrets.SNAKE_GITHUB_TOKEN }}
        run: |
          node scripts/snake-and-commits.ts \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-dark.svg \
            --theme matrix
          node scripts/snake-and-commits.ts \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-light.svg \
            --theme green
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
