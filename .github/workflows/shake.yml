name: snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate snake SVGs
        env:
          # Repository secret: a PAT owned by github.repository_owner with read:user.
          GH_TOKEN: ${{ secrets.SNAKE_GITHUB_TOKEN }}
        run: |
          python3 scripts/snake-and-commits.py \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-dark.svg \
            --theme matrix
          python3 scripts/snake-and-commits.py \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-light.svg \
            --theme green
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
