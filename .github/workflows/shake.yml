name: Generate Contribution Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test snake generator
        run: node --test scripts/test-snake-and-commits.ts
      - name: Generate snake SVGs
        env:
          # Repository secret: a PAT owned by github.repository_owner with read:user.
          GH_TOKEN: ${{ secrets.SNAKE_GITHUB_TOKEN }}
        run: |
          node scripts/snake-and-commits.ts \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-dark.svg \
            --theme matrix
          node scripts/snake-and-commits.ts \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-light.svg \
            --theme green
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
