<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300">
  <style>
    text { font-family: "JetBrains Mono", "Noto Sans SC", "PingFang SC", "SF Mono", monospace; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr-c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arr-e" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arr-v" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="820" height="300" fill="#0f172a"/>
  <rect width="820" height="300" fill="url(#grid)"/>

  <text x="22" y="32" fill="white" font-size="14" font-weight="700">Prometheus 监控架构</text>

  <!-- Arrows drawn before boxes -->
  <line x1="258" y1="129" x2="207" y2="129"
        stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#arr-c)"/>
  <line x1="207" y1="163" x2="258" y2="163"
        stroke="#34d399" stroke-width="1.5"
        marker-end="url(#arr-e)"/>
  <line x1="524" y1="150" x2="562" y2="150"
        stroke="#a78bfa" stroke-width="1.5"
        marker-end="url(#arr-v)"/>

  <!-- Go Service (cyan) -->
  <rect x="32" y="90" width="162" height="118" rx="6" fill="#0f172a"/>
  <rect x="32" y="90" width="162" height="118" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="113" y="115" fill="white" font-size="11" font-weight="600" text-anchor="middle">你的 Go 服务</text>
  <line x1="46" y1="122" x2="180" y2="122" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="113" y="141" fill="#94a3b8" font-size="9" text-anchor="middle">Counter · Gauge</text>
  <text x="113" y="156" fill="#94a3b8" font-size="9" text-anchor="middle">Histogram</text>
  <text x="113" y="175" fill="#22d3ee" font-size="9" font-weight="500" text-anchor="middle">埋点 → 暴露</text>
  <text x="113" y="198" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">/metrics</text>

  <!-- Prometheus (emerald) -->
  <rect x="272" y="48" width="248" height="214" rx="6" fill="#0f172a"/>
  <rect x="272" y="48" width="248" height="214" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="396" y="75" fill="white" font-size="12" font-weight="700" text-anchor="middle">Prometheus</text>
  <line x1="287" y1="83" x2="505" y2="83" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.5"/>

  <rect x="287" y="90" width="218" height="42" rx="4" fill="#0f172a"/>
  <rect x="287" y="90" width="218" height="42" rx="4" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="396" y="109" fill="white" font-size="10" font-weight="600" text-anchor="middle">① Scraper 抓取器</text>
  <text x="396" y="124" fill="#94a3b8" font-size="8" text-anchor="middle">主动发起 GET /metrics</text>

  <rect x="287" y="143" width="218" height="42" rx="4" fill="#0f172a"/>
  <rect x="287" y="143" width="218" height="42" rx="4" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="396" y="162" fill="white" font-size="10" font-weight="600" text-anchor="middle">② TSDB 时序数据库</text>
  <text x="396" y="177" fill="#94a3b8" font-size="8" text-anchor="middle">按时间序列持久化存储</text>

  <rect x="287" y="196" width="218" height="42" rx="4" fill="#0f172a"/>
  <rect x="287" y="196" width="218" height="42" rx="4" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="396" y="215" fill="white" font-size="10" font-weight="600" text-anchor="middle">③ PromQL 查询引擎</text>
  <text x="396" y="230" fill="#94a3b8" font-size="8" text-anchor="middle">响应查询，返回时间序列</text>

  <!-- Grafana (violet) -->
  <rect x="578" y="90" width="162" height="118" rx="6" fill="#0f172a"/>
  <rect x="578" y="90" width="162" height="118" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="659" y="115" fill="white" font-size="11" font-weight="600" text-anchor="middle">Grafana</text>
  <line x1="592" y1="122" x2="726" y2="122" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="659" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">可视化 Dashboard</text>
  <text x="659" y="164" fill="#94a3b8" font-size="9" text-anchor="middle">Panel = PromQL 查询</text>
  <text x="659" y="196" fill="#a78bfa" font-size="10" font-weight="500" text-anchor="middle">localhost:3000</text>

  <!-- Arrow labels -->
  <text x="232" y="117" fill="#22d3ee" font-size="8" text-anchor="middle" font-weight="500">GET /metrics</text>
  <text x="232" y="128" fill="#22d3ee" font-size="7" text-anchor="middle">← 每 5 秒（Prometheus 拉取）</text>
  <text x="232" y="178" fill="#34d399" font-size="8" text-anchor="middle">指标文本</text>
  <text x="543" y="141" fill="#a78bfa" font-size="8" text-anchor="middle">PromQL 查询</text>

  <!-- Port labels -->
  <text x="113" y="270" fill="#475569" font-size="8" text-anchor="middle">:8080</text>
  <text x="396" y="276" fill="#475569" font-size="8" text-anchor="middle">:9090</text>
  <text x="659" y="270" fill="#475569" font-size="8" text-anchor="middle">:3000</text>
</svg>